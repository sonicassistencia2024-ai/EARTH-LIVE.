<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EARTH LIVE — GitHub Pages</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="space"></div>
<canvas id="globe"></canvas>

<header class="top glass">
  <div class="logo">EARTH LIVE</div>
  <div class="live"><span></span> HTTPS • REAL SPACE VIEW</div>
</header>

<aside class="left glass">
  <div class="section-title">CAMADAS</div>
  <button class="layer active" data-layer="earth">🌍 Terra</button>
  <button class="layer active" data-layer="clouds">☁️ Nuvens</button>
  <button class="layer active" data-layer="stars">✨ Espaço</button>
  <button class="layer active" data-layer="iss">🛰️ ISS</button>
  <button class="layer active" data-layer="orbit">🛸 Órbita ISS</button>
</aside>

<aside class="right glass">
  <h2>🛰️ INTERNATIONAL SPACE STATION</h2>
  <div id="issStatus">● carregando dados orbitais...</div>
  <div class="row"><span>NORAD</span><b>25544</b></div>
  <div class="row"><span>Altitude</span><b id="altitude">---</b></div>
  <div class="row"><span>Latitude</span><b id="lat">---</b></div>
  <div class="row"><span>Longitude</span><b id="lon">---</b></div>
  <div class="row"><span>Velocidade</span><b id="velocity">---</b></div>
  <div class="row"><span>Fonte</span><b>CelesTrak</b></div>
</aside>

<div class="controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="reset">⟳</button>
</div>

<div class="bottom glass">
  <span>ARRASTE PARA GIRAR • RODA PARA ZOOM</span>
  <span>NASA BLUE MARBLE • CELESTRAK</span>
</div>

<div id="loading">
  <div class="loader"></div>
  <div>CARREGANDO EARTH LIVE...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.1/dist/satellite.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
